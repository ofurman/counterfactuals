# DiCoFlex under the DICTUM-aligned evaluation setup.
# See dictum_dice_config.yaml for the list of alignment choices.
#
# `target_class: null` matters most here: on the old config DiCoFlex ran at
# target_class 1 while DiCE and CCHVAE ran at 0, so the three methods were
# scored on disjoint query sets. Explaining both directions removes that.
defaults:
  - _self_
  - gen_model: large_maf
  - disc_model: dictum_mlp

hydra:
  sweeper:
    max_batch_size: 1

experiment:
  output_folder: results/dictum/
  relabel_with_disc_model: true
  seed: 42
  use_gpu: false
  # Flow generation space: MinMax on numeric features, one-hot categoricals kept
  # as raw 0/1 — matching the brinpow/dicoflex_repro reproduction (its
  # feature_transformer is MinMax + plain OneHotEncoder, no QuantileTransformer).
  # StandardScaler is used ONLY for metric computation (compute_dictum_metrics
  # --scaler standard --generation-scaler minmax), so explanations are found in
  # the generation space and reported in DICTUM's z-scored space.
  model_space_scaler: minmax
  # The shared DICTUM classifier (scripts/train_shared_disc_model.py, run with
  # dictum_dice_config) is trained in `standard` space. Naming its space here
  # makes the pipeline wrap it in SpaceAdapterClassifier, so every prediction
  # converts minmax_qt -> original units -> standard instead of feeding the
  # classifier a space it never saw (which collapsed adult to one class).
  disc_model_space_scaler: standard

dataset:
  _target_: counterfactuals.datasets.TrainTestFileDataset
  config_path: config/datasets/adult_split.yaml
  train_data_path: data_train_test_val/adult/train.csv
  test_data_path: data_train_test_val/adult/test.csv
  val_data_path: data_train_test_val/adult/val.csv

disc_model:
  train_model: true
  epochs: 100
  batch_size: 64
  patience: 15
  lr: 0.001
  validation_source: val

gen_model:
  train_model: true
  epochs: 200
  patience: 100
  lr: 0.001

density_model:
  model: ${gen_model.model}
  train_model: true
  batch_size: 256
  epochs: 20
  patience: 100
  lr: 0.001
  noise_lvl: 0.02
  eps: 1e-5

counterfactuals_params:
  cf_method:
    _target_: counterfactuals.cf_methods.DiCoFlex
  target_class: null
  n_test_samples: 2000
  p_values: [2.0]
  inference_p_value: 2.0
  # 32 neighbors and 0.01 noise match the brinpow/dicoflex_repro tabular runs
  # (train_generic_counterfactual.py: n_nearest=32, noise_level=0.01).
  n_neighbors: 32
  noise_level: 0.01
  # Repro parity (prob_threshold=0.55): neighbor targets restricted to training
  # points the classifier assigns >= this probability for their class. 0 = off.
  neighbor_prob_threshold: 0.55
  train_batch_factuals: 4
  val_ratio: 0.2
  num_counterfactuals: 100
  cf_samples_per_factual: 100
  sampling_batch_size: 256
  # Sampling temperature scaling the flow's base Gaussian, as in the original
  # DiCoFlex (ofurman/DiCoFlex): temp < 1 shrinks the base draw and bounds the
  # sampled tail. Our re-implementation had dropped this (sampled at 1.0).
  temperature: 0.8
  inference_mask_index: 0
  # Unconstrained, to match DiCE's restrict_to_actionable: false — the
  # immutable-feature list belongs to the constraint experiments, not here.
  use_actionability_mask: false
  custom_masks: []
  monotonic_overrides: {}
  log_prob_quantile: 0.25
  metrics_conf_path: counterfactuals/pipelines/conf/metrics/default.yaml

visualization:
  enable_training_batch: false
  enable_flow_contour: false
  enable_cf_scatter: false
