raw_data_path: data_train_test_val/gmc/train.csv
features:
  - RevolvingUtilizationOfUnsecuredLines
  - age
  - DebtRatio
  - MonthlyIncome
  - NumberOfOpenCreditLinesAndLoans
  - NumberOfTimes90DaysLate
  - NumberRealEstateLoansOrLines
  - NumberOfTime30-59DaysPastDueNotWorse
  - NumberOfTime60-89DaysPastDueNotWorse
  - NumberOfDependents
continuous_features:
  - RevolvingUtilizationOfUnsecuredLines
  - age
  - DebtRatio
  - MonthlyIncome
  - NumberOfOpenCreditLinesAndLoans
  - NumberOfTimes90DaysLate
  - NumberRealEstateLoansOrLines
categorical_features:
  - NumberOfTime30-59DaysPastDueNotWorse
  - NumberOfTime60-89DaysPastDueNotWorse
  - NumberOfDependents
feature_config:
  RevolvingUtilizationOfUnsecuredLines: {actionable: true}
  age: {actionable: true}
  DebtRatio: {actionable: true}
  MonthlyIncome: {actionable: true}
  NumberOfOpenCreditLinesAndLoans: {actionable: true}
  NumberOfTimes90DaysLate: {actionable: true}
  NumberRealEstateLoansOrLines: {actionable: true}
  NumberOfTime30-59DaysPastDueNotWorse: {actionable: true}
  NumberOfTime60-89DaysPastDueNotWorse: {actionable: true}
  NumberOfDependents: {actionable: true}
target: SeriousDlqin2yrs
target_mapping:
  "0": 0
  "1": 1
  0: 0
  1: 1
initial_transforms:
  - name: reorder_columns
  - name: dropna
  - name: one_hot_encode
    params:
      drop_first: false
